<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F6FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מסלול הגישה">
</head>
<body>
<title>מסלול הגישה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F3F6FA; --card:#FFFFFF; --card2:#F7F9FC;
  --ink:#182533; --soft:#5C6E80; --faint:#93A3B2; --line:#E4EAF1;
  --blue:#3B7DD8;  --blue-t:#E9F1FD;
  --teal:#1F8C80;  --teal-t:#E2F3F0;
  --amber:#B8791A; --amber-t:#FAEFDC;
  --violet:#6B55BC;--violet-t:#EEEBFA;
  --rose:#BC4E79;  --rose-t:#FBEAF1;
  --ok:#1C8A62;    --ok-t:#E2F4EC;
  --bad:#BE443B;   --bad-t:#FCE9E7;
  --r:16px; --r-sm:11px;
  --sh:0 1px 2px rgba(24,37,51,.05),0 8px 22px -12px rgba(24,37,51,.20);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;text-align:right;
  font-family:Assistant,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance;font-weight:400;font-family:"Secular One",Assistant,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.app{max-width:470px;margin:0 auto;padding:0 16px 46px;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;
  display:flex;align-items:center;gap:12px}
.top h1{font-size:19px}
.back{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--sh);
  display:grid;place-items:center;flex:none;font-size:17px;color:var(--soft)}
.sub{font-size:13px;color:var(--faint);margin-top:1px}

/* ---------- home ---------- */
.hero{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:14px}
.hero-row{display:flex;gap:8px}
.hstat{flex:1;text-align:center;padding:4px 2px}
.hstat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:500;line-height:1.15}
.hstat span{font-size:12px;color:var(--faint)}
.hstat+.hstat{border-inline-start:1px solid var(--line)}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:right;
  background:var(--card);border-radius:var(--r);padding:15px 16px;box-shadow:var(--sh);
  transition:transform .12s ease}
.tile:active{transform:scale(.985)}
.ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none}
.ico svg{width:23px;height:23px;display:block}
.tile-txt{flex:1;min-width:0}
.tile-txt b{display:block;font-family:"Secular One",Assistant,sans-serif;font-weight:400;font-size:17px}
.tile-txt span{display:block;font-size:13.5px;color:var(--soft);line-height:1.4}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.chev{color:var(--faint);font-size:18px;flex:none}
.foot{margin-top:20px;font-size:12.5px;color:var(--faint);text-align:center;line-height:1.6}

/* ---------- question ---------- */
.dots{display:flex;gap:3px;margin-bottom:14px}
.dots i{height:4px;flex:1;background:var(--line);border-radius:3px}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--blue)}
.qcard{background:var(--card);border-radius:var(--r);padding:20px 18px;box-shadow:var(--sh)}
.qtag{font-size:12.5px;font-weight:700;color:var(--blue);background:var(--blue-t);
  display:inline-block;padding:3px 10px;border-radius:20px;margin-bottom:12px}
.qtag.warn{color:var(--amber);background:var(--amber-t)}
.qtext{font-family:"Secular One",Assistant,sans-serif;font-size:21px;line-height:1.4;margin-bottom:18px}
.qtext .mono{font-size:.95em}
.opts{display:grid;gap:9px}
.opt{display:block;width:100%;text-align:right;padding:13px 15px;border-radius:var(--r-sm);
  background:var(--card2);border:1.5px solid var(--line);font-size:15.5px;line-height:1.4;
  transition:border-color .12s,background .12s}
.opt:active:not(:disabled){background:var(--blue-t)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-t);border-color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-t);border-color:var(--bad)}
.tf{display:flex;gap:8px}
.tf input{flex:1;min-width:0;font:inherit;font-size:16px;padding:13px 15px;border-radius:var(--r-sm);
  border:1.5px solid var(--line);background:var(--card2);color:var(--ink)}
.tf input:focus{outline:none;border-color:var(--blue);background:#fff}
.btn{background:var(--blue);color:#fff;font-weight:700;padding:13px 20px;border-radius:var(--r-sm);
  font-size:15.5px;text-align:center}
.btn.full{display:block;width:100%}
.btn.soft{background:var(--card2);color:var(--soft);border:1.5px solid var(--line)}
.row{display:flex;gap:9px;margin-top:16px}
.row>*{flex:1}

/* feedback */
.fb{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.fb-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.fb-em{width:54px;height:54px;border-radius:50%;background:var(--card2);object-fit:contain;padding:4px;flex:none}
.fb-title{font-weight:700;font-size:16px}
.fb-title.ok{color:var(--ok)} .fb-title.no{color:var(--bad)}
.fb-title small{display:block;font-weight:400;font-size:13.5px;color:var(--soft)}
.trick{background:var(--amber-t);border-radius:var(--r-sm);padding:11px 13px;font-size:14.5px;line-height:1.5}
.trick b{color:var(--amber)}
.facts{margin-top:10px;display:grid;gap:4px;font-size:14px;color:var(--soft)}
.facts b{color:var(--ink);font-weight:600}
.hardbtn{margin-top:12px;font-size:13.5px;color:var(--soft);border:1.5px solid var(--line);
  border-radius:20px;padding:5px 13px}
.hardbtn[aria-pressed="true"]{background:var(--amber-t);border-color:var(--amber);color:var(--amber)}

/* ---------- lists ---------- */
.pick{display:grid;gap:9px}
.pick button{display:flex;align-items:center;gap:12px;width:100%;text-align:right;background:var(--card);
  border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh)}
.pick b{font-family:"Secular One",Assistant,sans-serif;font-weight:400;font-size:16.5px;display:block}
.pick span{font-size:13px;color:var(--soft)}
.pick .n{margin-inline-start:auto;font-size:12.5px;color:var(--faint);white-space:nowrap}
.unit{display:flex;gap:13px;background:var(--card);border-radius:var(--r);padding:14px 15px;
  box-shadow:var(--sh);margin-bottom:10px;align-items:flex-start}
.em{width:52px;height:52px;border-radius:50%;background:var(--card2);object-fit:contain;padding:3px;flex:none}
.em.ph{display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--faint)}
.unit-b{flex:1;min-width:0}
.unit-n{font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--blue);font-size:15px;margin-inline-end:6px}
.unit-t{font-family:"Secular One",Assistant,sans-serif;font-size:16px}
.unit-r{font-size:13.5px;color:var(--soft);line-height:1.45;margin-top:3px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--blue-t);color:var(--blue)}
.tag.g{background:var(--teal-t);color:var(--teal)}
.unit .trick{margin-top:9px;font-size:13.5px}
.note{background:var(--violet-t);color:#3F3277;border-radius:var(--r-sm);padding:12px 14px;
  font-size:13.5px;line-height:1.55;margin-bottom:14px}
.note.b{background:var(--blue-t);color:#1D4F8E}

/* recall slots */
.slots{display:grid;gap:7px;margin-top:14px}
.slot{border-radius:var(--r-sm);padding:10px 13px;font-size:14.5px;background:var(--card2);
  border:1.5px dashed var(--line);color:var(--faint);display:flex;align-items:center;gap:9px;min-height:44px}
.slot.got{border-style:solid;border-color:var(--ok);background:var(--ok-t);color:var(--ink);font-weight:600}
.slot.shown{border-style:solid;background:var(--card2);color:var(--soft)}
.slot img{width:26px;height:26px;border-radius:50%;flex:none}

/* progress */
.bars{background:var(--card);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:14px}
.bar{display:flex;align-items:center;gap:11px;padding:7px 0;font-size:14.5px}
.bar span:first-child{width:78px;font-weight:600}
.track{flex:1;height:7px;background:var(--line);border-radius:5px;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px}
.bar .pc{width:40px;text-align:left;color:var(--soft);font-family:"IBM Plex Mono",monospace;font-size:13px}
.weak{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.weak:last-child{border-bottom:0}
.weak em{font-style:normal;color:var(--bad);font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap}
.big{font-family:"Secular One",Assistant,sans-serif;font-size:26px;text-align:center;margin:6px 0 4px}
.mid{text-align:center;color:var(--soft);font-size:14.5px;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="app">
  <div class="top" id="top"></div>
  <div id="screen"></div>
</div>

{n:"118",nick:"טייסת דורסי הלילה",b:"tn",cat:"מסוקים",craft:["יסעור"],role:"מסוקי חילוץ ותובלה",mn:"118 ו־119 שתיהן יצורי לילה — אבל 118 היא מסוק (יסעור) ו־119 היא מטוס קרב (עטלף)."},

{n:"200",nick:"טייסת המל״טים הראשונה",b:"hz",cat:"כטמ״מ",craft:["שובל"],role:"טייסת כלי טיס מאוישים מרחוק",mn:"200 — עגול ונקי, ה״ראשונה״ של מערך הכטמ״מ."},
{n:"100",nick:"טייסת הגמל המעופף",b:"hz",cat:"תובלה",craft:["צופית","חופית"],role:"איסוף מודיעין, סיוע לכוחות קרקע ואוויר, והדרכה",mn:"גמל נושא משא — 100 היא טייסת תובלה, ו־100 הוא מספר עגול ״כבד״."},

<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY=864e5, now=()=>Date.now();
const TOP=$("#top"), SCR=$("#screen");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function sample(a,k,not){return shuffle(a.filter(x=>x!==not)).slice(0,k);}
const isNum=s=>/^\d+$/.test(s);
const label=s=>isNum(s.n)?s.n+" · "+s.nick:s.nick;
const baseOf=id=>BASES.find(b=>b.id===id);
const baseLabel=b=>b.name+" ("+b.unit+")";
const emblem=s=>s?(EMB[s.n]||EMB[s.nick]||null):null;

function norm(s){return String(s).toLowerCase()
  .replace(/[׳״"'`.,\-־–—()]/g,"")
  .replace(/טייסת|יחידת|יחידה|גדוד|בסיס|כנף/g,"")
  .replace(/\s+/g,"").replace(/^ה/,"").trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m||!n)return Math.max(m,n);
  let p=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){let pr=p[0];p[0]=i;
    for(let j=1;j<=n;j++){const t=p[j];p[j]=Math.min(p[j]+1,p[j-1]+1,pr+(a[i-1]===b[j-1]?0:1));pr=t;}}
  return p[n];}
function matches(input,answer){const a=norm(input),b=norm(answer);
  if(!a)return false; if(a===b)return true;
  if(a.length>=4&&b.includes(a))return true;
  return lev(a,b)<=(b.length>7?2:b.length>4?1:0);}

/* ================= storage + spacing ================= */
const KEY="maslul-hagisha-v1";
let ST={items:{},hist:[],streak:{last:0,days:0}};
try{const raw=localStorage.getItem(KEY);if(raw)ST=Object.assign(ST,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST));}catch(e){}}
function rec(id){return ST.items[id]||(ST.items[id]={ef:2.5,int:0,reps:0,due:0,seen:0,miss:0,hard:0});}
function schedule(id,ok){const r=rec(id);r.seen++;
  if(!ok){r.reps=0;r.int=1;r.miss++;r.ef=Math.max(1.3,r.ef-0.2);}
  else{r.reps++;r.int=r.reps===1?1:r.reps===2?4:Math.round(r.int*r.ef);r.ef=Math.min(2.8,r.ef+0.05);}
  r.due=now()+r.int*DAY;save();}
function markStreak(){const t=new Date().setHours(0,0,0,0);
  if(ST.streak.last!==t){ST.streak.days=(t-ST.streak.last===DAY)?ST.streak.days+1:1;ST.streak.last=t;save();}}

/* ================= item bank ================= */
const ITEMS=[];
const count=(arr,k)=>arr.reduce((m,x)=>(m[x[k]]=(m[x[k]]||0)+1,m),{});
const NICKC=count(SQ,"nick"), ROLEC=count(SQ,"role");
const withCraft=SQ.filter(s=>s.craft&&s.craft.length);
SQ.forEach(s=>{
  const k=s.n+"/"+s.nick;
  if(isNum(s.n))ITEMS.push({id:"n2nick|"+k,t:"n2nick",s});
  if(isNum(s.n)&&NICKC[s.nick]===1)ITEMS.push({id:"nick2n|"+k,t:"nick2n",s});
  ITEMS.push({id:"sq2base|"+k,t:"sq2base",s});
  if(s.craft.length)ITEMS.push({id:"sq2craft|"+k,t:"sq2craft",s});
  if(ROLEC[s.role]===1)ITEMS.push({id:"role2sq|"+k,t:"role2sq",s});
});
SUPPORT.forEach(x=>ITEMS.push({id:"sup|"+x.name,t:"sup",x}));
CONCEPTS.forEach((c,i)=>ITEMS.push({id:"con|"+i,t:"con",c}));

const TAG={n2nick:"מה הכינוי?",nick2n:"מה המספר?",sq2base:"באיזה בסיס?",sq2craft:"איזה כלי טיס?",
  role2sq:"איזו יחידה זו?",sup:"יחידות תומכות",con:"מבנה הבסיס"};

function facts(s){const f=[];
  if(isNum(s.n))f.push(["טייסת",s.n+" — "+s.nick]);
  if(s.craft.length)f.push(["כלי טיס",s.craft.join(", ")]);
  f.push(["בסיס",baseLabel(baseOf(s.b))]);
  f.push(["מה היא עושה",s.role]);
  return f;}
function uniq(a){return a.filter((v,i)=>a.indexOf(v)===i);}

function build(it){const s=it.s;
  switch(it.t){
  case "n2nick":return{tag:TAG.n2nick,mode:"mcq",s,
    text:'איך קוראים לטייסת <span class="mono">'+s.n+'</span>?',answer:s.nick,
    options:shuffle(uniq([s.nick,...sample(SQ.filter(o=>o.cat===s.cat&&o.nick!==s.nick).map(o=>o.nick),3),
      ...sample(SQ.map(o=>o.nick),3,s.nick)]).slice(0,4)),facts:facts(s),trick:s.mn};
  case "nick2n":return{tag:TAG.nick2n,mode:"type",s,
    text:"מה המספר של "+esc(s.nick)+"?",answer:s.n,ph:"הקלד מספר",facts:facts(s),trick:s.mn};
  case "sq2base":return{tag:TAG.sq2base,mode:"mcq",s,
    text:"איפה נמצאת "+(isNum(s.n)?'טייסת <span class="mono">'+s.n+'</span> ('+esc(s.nick)+")":esc(s.nick))+"?",
    answer:baseLabel(baseOf(s.b)),
    options:shuffle([baseLabel(baseOf(s.b)),...sample(BASES.filter(b=>b.id!==s.b).map(baseLabel),3)]),
    facts:facts(s),trick:s.mn};
  case "sq2craft":{const A=s.craft.join(", ");
    const pool=uniq(withCraft.map(o=>o.craft.join(", "))).filter(c=>c!==A);
    return{tag:TAG.sq2craft,mode:"mcq",s,
    text:"במה טסה "+(isNum(s.n)?'טייסת <span class="mono">'+s.n+'</span>':esc(s.nick))+"?",
    answer:A,
    options:shuffle([A,...sample(pool,3)]),
    facts:facts(s),trick:s.mn};}
  case "role2sq":return{tag:TAG.role2sq,mode:"mcq",s,
    text:"איזו יחידה זו: ״"+esc(s.role)+"״?",answer:label(s),
    options:shuffle(uniq([label(s),...sample(SQ.filter(o=>o.cat===s.cat&&o.nick!==s.nick).map(label),3),
      ...sample(SQ.map(label),3,label(s))]).slice(0,4)),facts:facts(s),trick:s.mn};
  case "sup":{const x=it.x;return{tag:TAG.sup,mode:"mcq",
    text:"מי אחראי על ״"+esc(x.key)+"״?",answer:x.name,
    options:shuffle(SUPPORT.map(o=>o.name)),facts:[["מה היא עושה",x.role]],trick:null};}
  case "con":{const c=it.c;return{tag:TAG.con,mode:"mcq",text:esc(c.q),answer:c.a,
    options:shuffle([c.a,...c.wrong]),facts:[],trick:null};}}}

/* ================= screens ================= */
let SC="home", S=null, PICK=null, GOT={};

function header(title,sub,back){
  TOP.innerHTML=(back?'<button class="back" id="bk" aria-label="חזרה"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>':"")+
    '<div><h1>'+esc(title)+"</h1>"+(sub?'<div class="sub">'+esc(sub)+"</div>":"")+"</div>";
  if(back)$("#bk").onclick=back;}

function go(s){SC=s;window.scrollTo(0,0);
  ({home:home,practice:practice,recallPick:recallPick,recall:recall,
    examIntro:examIntro,exam:()=>question(),learnPick:learnPick,learn:learn,progress:progress})[s]();}

/* ---- home ---- */
const ICONS={
 practice:'<path d="M4 12h4l3-8 4 16 3-8h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
 exam:'<path d="M6 3h9l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 13l2 2 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
 recall:'<path d="M12 21s-7-4.5-7-10a7 7 0 0 1 14 0c0 5.5-7 10-7 10z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="11" r="2.4" fill="currentColor"/>',
 learn:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 8h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
 progress:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'};
function tile(id,color,title,sub,badge){
  return '<button class="tile" data-go="'+id+'">'+
    '<span class="ico" style="background:var(--'+color+'-t);color:var(--'+color+')">'+
      '<svg viewBox="0 0 24 24">'+ICONS[id.replace(/Pick|Intro/,"").replace("exam","exam")]+"</svg></span>"+
    '<span class="tile-txt"><b>'+esc(title)+"</b><span>"+esc(sub)+"</span></span>"+
    (badge?'<span class="badge" style="background:var(--'+color+'-t);color:var(--'+color+')">'+esc(badge)+"</span>":"")+
    '<span class="chev"><svg viewBox="0 0 24 24" width="17" height="17"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>';}

function home(){
  const t=now(), seen=ITEMS.filter(i=>ST.items[i.id]);
  const due=seen.filter(i=>ST.items[i.id].due<=t).length;
  const solid=seen.filter(i=>ST.items[i.id].reps>=3).length;
  header("מסלול הגישה","בסיסים וטייסות של חיל האוויר · בלמ״ס");
  SCR.innerHTML=
   '<div class="hero"><div class="hero-row">'+
     '<div class="hstat"><b>'+solid+"</b><span>כבר יודע</span></div>"+
     '<div class="hstat"><b>'+due+"</b><span>לחזור עליהן היום</span></div>"+
     '<div class="hstat"><b>'+(ITEMS.length-seen.length)+"</b><span>עוד לא ראית</span></div>"+
   "</div></div>"+
   '<div class="tiles">'+
    tile("practice","blue","תרגול","שאלות מעורבות. מה שטעית בו יחזור שוב",due?due+" לחזרה":"התחל")+
    tile("recallPick","teal","לזכור לבד","לרשום את כל היחידות בבסיס, בלי אפשרויות לבחור")+
    tile("examIntro","amber","מבחן","25 שאלות ברצף, ציון בסוף")+
    tile("learnPick","violet","ללמוד","כל הבסיסים, היחידות והסמלים")+
    tile("progress","rose","ההתקדמות שלי","מה כבר יודע ומה עוד לא")+
   "</div>"+
   '<div class="foot">הנתונים מבוססים על לומדת הבו״טים.<br>ההתקדמות נשמרת במכשיר הזה בלבד.</div>';
  $$("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));}

/* ---- practice / exam ---- */
function queue(n){const t=now();
  const due=ITEMS.filter(i=>ST.items[i.id]&&ST.items[i.id].due<=t).sort((a,b)=>ST.items[a.id].due-ST.items[b.id].due);
  const fresh=shuffle(ITEMS.filter(i=>!ST.items[i.id]));
  const take=Math.min(due.length,Math.ceil(n*0.7));
  return shuffle([...due.slice(0,take),...fresh.slice(0,n-take)]).slice(0,n);}
function practice(){markStreak();
  if(!S||S.done||S.exam)S={q:queue(20),i:0,right:0,marks:[],exam:false,wrong:[],t0:now()};
  question();}
function examIntro(){header("מבחן","",()=>go("home"));
  SCR.innerHTML='<div class="qcard"><div class="qtag warn">בדיקה, לא תרגול</div>'+
   '<div class="qtext">25 שאלות ברצף</div>'+
   '<div class="facts"><div>לא תראה אם צדקת עד הסוף. השאלות נשלפות מכל החומר — טייסות, בסיסים, כלי טיס, יחידות תומכות ומבנה בסיס.</div>'+
   "<div>התוצאה לא משנה את סדר החזרות בתרגול.</div></div>"+
   '<div class="row"><button class="btn" id="st">להתחיל</button></div></div>';
  $("#st").onclick=()=>{S={q:shuffle(ITEMS).slice(0,25),i:0,right:0,marks:[],exam:true,wrong:[],t0:now()};question();};}

function question(){
  SC=S.exam?"exam":"practice";
  if(S.i>=S.q.length)return finish();
  const it=S.q[S.i],Q=build(it);S.cur=Q;const r=ST.items[it.id];
  header(S.exam?"מבחן":"תרגול","שאלה "+(S.i+1)+" מתוך "+S.q.length,()=>{S.done=!S.exam;go("home");});
  SCR.innerHTML='<div class="dots">'+S.q.map((_,i)=>'<i class="'+(S.marks[i]===1?"ok":S.marks[i]===0?"no":i===S.i?"now":"")+'"></i>').join("")+"</div>"+
   '<div class="qcard">'+
    '<span class="qtag'+(!S.exam&&r&&r.miss>1?" warn":"")+'">'+esc(Q.tag)+(!S.exam&&r&&r.miss>1?" · טעית כאן "+r.miss+" פעמים":"")+"</span>"+
    '<div class="qtext">'+Q.text+"</div>"+
    (Q.mode==="mcq"
      ? '<div class="opts">'+Q.options.map((o,k)=>'<button class="opt" data-k="'+k+'">'+esc(o)+"</button>").join("")+"</div>"
      : '<form class="tf" id="tf"><input id="ti" autocomplete="off" inputmode="'+(Q.tag===TAG.nick2n?"numeric":"text")+'" placeholder="'+esc(Q.ph||"התשובה שלך")+'"><button class="btn" type="submit">בדוק</button></form>')+
    '<div id="fb"></div></div>';
  if(Q.mode==="mcq")$$(".opt").forEach(b=>b.onclick=()=>answer(Q.options[+b.dataset.k]));
  else{$("#tf").onsubmit=e=>{e.preventDefault();answer($("#ti").value);};setTimeout(()=>$("#ti")&&$("#ti").focus(),40);}}

function answer(val){
  const it=S.q[S.i],Q=S.cur;
  const ok=Q.mode==="mcq"?val===Q.answer:matches(val,Q.answer);
  S.marks[S.i]=ok?1:0; if(ok)S.right++; else S.wrong.push(Q);
  if(!S.exam)schedule(it.id,ok);
  ST.hist.push({t:now(),ok:ok?1:0}); if(ST.hist.length>4000)ST.hist=ST.hist.slice(-3000); save();
  if(!ok&&!S.exam)S.q.splice(Math.min(S.q.length,S.i+4),0,it);

  $$(".opt").forEach(b=>{b.disabled=true;const t=Q.options[+b.dataset.k];
    if(t===Q.answer)b.classList.add("right"); else if(t===val)b.classList.add("wrong");});
  if($("#ti")){$("#ti").disabled=true;$("#ti").style.borderColor=ok?"var(--ok)":"var(--bad)";
    $("#tf button").disabled=true;}
  if(S.exam){S.i++;question();return;}

  const em=emblem(Q.s);
  $("#fb").innerHTML='<div class="fb"><div class="fb-head">'+
    (em?'<img class="fb-em" src="'+em+'" alt="">':"")+
    '<div class="fb-title '+(ok?"ok":"no")+'">'+(ok?"נכון":"לא נכון")+
      "<small>"+(ok?esc(Q.s?label(Q.s):Q.answer):"התשובה: "+esc(Q.answer))+"</small></div></div>"+
    (Q.trick?'<div class="trick"><b>טריק לזכירה · </b>'+esc(Q.trick)+"</div>":"")+
    (Q.facts.length?'<div class="facts">'+Q.facts.map(f=>"<div><b>"+esc(f[0])+":</b> "+esc(f[1])+"</div>").join("")+"</div>":"")+
    (ok?'<button class="hardbtn" id="hd">היה לי קשה — תראה לי שוב מחר</button>':"")+
    '<div class="row"><button class="btn" id="nx">הבא</button></div></div>';
  const hd=$("#hd");
  if(hd)hd.onclick=()=>{hd.setAttribute("aria-pressed","true");hd.textContent="נשמר — יחזור מחר";
    const r=rec(it.id);r.hard++;r.int=1;r.due=now()+DAY;save();};
  $("#nx").onclick=()=>{S.i++;question();};
  $("#nx").focus();}

function finish(){
  const pct=Math.round(S.right/S.q.length*100),sec=Math.round((now()-S.t0)/1000);
  header(S.exam?"תוצאת המבחן":"סיימת סבב","",()=>{S.done=true;go("home");});
  SCR.innerHTML='<div class="qcard">'+
   '<div class="big">'+S.right+" מתוך "+S.q.length+"</div>"+
   '<div class="mid">'+pct+"% · "+Math.floor(sec/60)+" דקות ו־"+(sec%60)+" שניות</div>"+
   (S.exam?"":'<div class="mid">מה שטעית בו יחזור אליך מוקדם יותר בפעם הבאה.</div>')+
   '<div class="row"><button class="btn" id="ag">עוד סבב</button>'+
   '<button class="btn soft" id="hm">לדף הבית</button></div></div>'+
   (S.wrong.length?'<div class="note" style="margin-top:14px">כדאי לחזור על אלה:</div>'+
     S.wrong.map(Q=>{const em=emblem(Q.s);
       return '<div class="unit">'+(em?'<img class="em" src="'+em+'" alt="">':'<div class="em ph">?</div>')+
       '<div class="unit-b"><div class="unit-t">'+esc(Q.answer)+"</div>"+
       '<div class="unit-r">'+Q.text.replace(/<[^>]+>/g,"")+"</div>"+
       (Q.trick?'<div class="trick">'+esc(Q.trick)+"</div>":"")+"</div></div>";}).join(""):"");
  const wasExam=S.exam;
  $("#ag").onclick=()=>{S=null;go(wasExam?"examIntro":"practice");};
  $("#hm").onclick=()=>{S.done=true;go("home");};}

/* ---- remember on your own ---- */
function recallPick(){
  header("לזכור לבד","בחר בסיס",()=>go("home"));
  SCR.innerHTML='<div class="note">כאן אין אפשרויות לבחור מהן — צריך לשלוף מהראש. זה הכי קשה, ולכן הכי מקבע.</div>'+
   '<div class="pick">'+BASES.map(b=>'<button data-b="'+b.id+'"><span><b>'+esc(b.name)+"</b><span>"+esc(b.unit)+
     '</span></span><span class="n">'+SQ.filter(s=>s.b===b.id).length+" יחידות</span></button>").join("")+"</div>";
  $$("[data-b]").forEach(x=>x.onclick=()=>{PICK=x.dataset.b;go("recall");});}

function recall(){
  const b=baseOf(PICK),list=SQ.filter(s=>s.b===PICK);
  const got=GOT[PICK]||(GOT[PICK]={});
  const n=Object.values(got).filter(v=>v===1).length;
  header(b.name,n+" מתוך "+list.length+" נזכרת",()=>go("recallPick"));
  SCR.innerHTML='<div class="qcard">'+
   '<form class="tf" id="rf"><input id="ri" autocomplete="off" placeholder="שם או מספר של יחידה בבסיס"><button class="btn" type="submit">הוסף</button></form>'+
   '<div class="slots">'+list.map((s,i)=>{const st=got[i],em=emblem(s);
     return '<div class="slot '+(st===1?"got":st===2?"shown":"")+'">'+
       (st&&em?'<img src="'+em+'" alt="">':"")+(st?esc(label(s)):"— עוד לא —")+"</div>";}).join("")+"</div>"+
   '<div class="row"><button class="btn soft" id="rv">הראה את השאר</button>'+
   '<button class="btn soft" id="rs">מחדש</button></div></div>';
  $("#rf").onsubmit=e=>{e.preventDefault();const v=$("#ri").value;
    const hit=list.findIndex((s,i)=>!got[i]&&(matches(v,s.nick)||(s.n!=="—"&&norm(v)===norm(s.n))));
    if(hit>-1)got[hit]=1;
    go("recall");setTimeout(()=>$("#ri")&&$("#ri").focus(),30);};
  $("#rv").onclick=()=>{list.forEach((s,i)=>{if(!got[i])got[i]=2;});go("recall");};
  $("#rs").onclick=()=>{GOT[PICK]={};go("recall");};
  setTimeout(()=>$("#ri")&&$("#ri").focus(),30);}

/* ---- learn ---- */
function learnPick(){
  header("ללמוד","הבסיסים מסודרים מצפון לדרום",()=>go("home"));
  SCR.innerHTML='<div class="note b">הסדר כאן גאוגרפי ולא לפי מספר — כך קל יותר לזכור איפה כל בסיס יושב.</div>'+
   '<div class="pick">'+BASES.map(b=>'<button data-b="'+b.id+'"><span><b>'+esc(b.name)+"</b><span>"+
     esc(b.unit)+" · "+esc(b.geo)+'</span></span><span class="n">'+SQ.filter(s=>s.b===b.id).length+"</span></button>").join("")+
   "</div>"+
   '<div class="pick" style="margin-top:10px"><button data-b="support"><span><b>טייסות תומכות</b>'+
   "<span>קיימות בכל בסיס</span></span></button></div>";
  $$("[data-b]").forEach(x=>x.onclick=()=>{PICK=x.dataset.b;go("learn");});}

function unitCard(s){const em=emblem(s);
  return '<div class="unit">'+(em?'<img class="em" src="'+em+'" alt="סמל '+esc(s.nick)+'">':
    '<div class="em ph">'+(s.n&&s.n!=="—"?esc(s.n):"✦")+"</div>")+
   '<div class="unit-b"><div>'+(isNum(s.n)?'<span class="unit-n mono">'+esc(s.n)+"</span>":"")+
   '<span class="unit-t">'+esc(s.nick)+"</span></div>"+
   '<div class="unit-r">'+esc(s.role)+"</div>"+
   (s.craft&&s.craft.length?'<div class="tags">'+s.craft.map(c=>'<span class="tag">'+esc(c)+"</span>").join("")+"</div>":"")+
   (s.mn?'<div class="trick"><b>טריק · </b>'+esc(s.mn)+"</div>":"")+"</div></div>";}

function learn(){
  if(PICK==="support"){
    header("טייסות תומכות","קיימות בכל בסיס",()=>go("learnPick"));
    SCR.innerHTML='<div class="note">בסיס טיסה מורכב מטייסות טיסה ומטייסות תומכות. בבח״א יש גם יחידות קרקעיות שאינן מבצעיות; בכנף יש טייסות מבצעיות בלבד.</div>'+
     SUPPORT.map(x=>'<div class="unit"><div class="em ph">✦</div><div class="unit-b">'+
      '<div class="unit-t">'+esc(x.name)+'</div><div class="unit-r">'+esc(x.role)+"</div>"+
      '<div class="tags"><span class="tag g">'+esc(x.key)+"</span></div></div></div>").join("");
    return;}
  const b=baseOf(PICK),list=SQ.filter(s=>s.b===PICK);
  header(b.name,b.unit+" · "+list.length+" יחידות",()=>go("learnPick"));
  SCR.innerHTML='<div class="note b">'+esc(b.geo)+" · "+esc(b.note)+"</div>"+
   list.map(unitCard).join("")+
   (PICK==="pl"?'<div class="note" style="margin-top:4px">יחידות וניסויים נוספים בבסיס</div>'+
     EXTRA_PL.map(unitCard).join("")+
     '<div class="unit">'+(EMB["כנף 7"]?'<img class="em" src="'+EMB["כנף 7"]+'" alt="סמל כנף 7">':'<div class="em ph">7</div>')+
     '<div class="unit-b"><div class="unit-t">'+esc(WING7.name)+"</div>"+
     '<div class="tags">'+WING7.units.map(u=>'<span class="tag g">'+esc(u)+"</span>").join("")+"</div></div></div>":"");}

/* ---- progress ---- */
function progress(){
  const t=now(),seen=ITEMS.filter(i=>ST.items[i.id]);
  const solid=seen.filter(i=>ST.items[i.id].reps>=3).length;
  const acc=ST.hist.length?Math.round(ST.hist.reduce((a,h)=>a+h.ok,0)/ST.hist.length*100):0;
  const weak=seen.filter(i=>ST.items[i.id].miss>0)
    .sort((a,b)=>ST.items[b.id].miss-ST.items[a.id].miss).slice(0,8);
  header("ההתקדמות שלי","",()=>go("home"));
  SCR.innerHTML=
   '<div class="hero"><div class="hero-row">'+
     '<div class="hstat"><b>'+solid+"</b><span>כבר יודע</span></div>"+
     '<div class="hstat"><b>'+acc+"%</b><span>אחוז נכונות</span></div>"+
     '<div class="hstat"><b>'+ST.streak.days+"</b><span>ימים ברצף</span></div></div></div>"+
   '<div class="bars"><b style="font-size:14.5px">כמה אתה יודע על כל בסיס</b>'+
    BASES.map(b=>{const ids=ITEMS.filter(i=>i.s&&i.s.b===b.id);
      const m=ids.filter(i=>ST.items[i.id]&&ST.items[i.id].reps>=2).length;
      const p=ids.length?Math.round(m/ids.length*100):0;
      const c=p>66?"var(--ok)":p>33?"var(--amber)":"var(--rose)";
      return '<div class="bar"><span>'+esc(b.name)+'</span><span class="track"><i style="width:'+p+"%;background:"+c+'"></i></span><span class="pc">'+p+"%</span></div>";}).join("")+
    "</div>"+
   (weak.length?'<div class="bars"><b style="font-size:14.5px">מה הכי מבלבל אותך</b>'+
     weak.map(i=>{const r=ST.items[i.id];
       return '<div class="weak"><span>'+esc(i.s?label(i.s):i.x?i.x.name:"מבנה הבסיס")+" · "+esc(TAG[i.t])+
       "</span><em>"+r.miss+"/"+r.seen+"</em></div>";}).join("")+
     '<div class="row"><button class="btn" id="dr">תרגל רק את אלה</button></div></div>':
    '<div class="note">עוד אין מספיק נתונים. אחרי כמה סבבי תרגול יופיע כאן מה הכי מבלבל אותך.</div>')+
   '<div class="bars"><b style="font-size:14.5px">איך זה עובד</b>'+
    '<div class="facts" style="margin-top:8px">'+
    "<div><b>שואלים אותך במקום להראות לך.</b> לשלוף תשובה מהראש מקבע הרבה יותר טוב מלקרוא שוב.</div>"+
    "<div><b>כל פריט חוזר בזמן משלו.</b> מה שידעת יחזור בעוד כמה ימים, מה שטעית בו יחזור מיד.</div>"+
    "<div><b>השאלות מעורבבות.</b> קפיצה בין בסיסים מאמנת אותך להבחין בין טייסות דומות.</div>"+
    "<div><b>לכל טייסת יש טריק לזכירה.</b> קישור בין המספר לשם עובד טוב יותר משינון יבש.</div></div>"+
    '<div class="row"><button class="btn soft" id="wp">אפס הכול</button></div></div>';
  const dr=$("#dr");
  if(dr)dr.onclick=()=>{S={q:shuffle(weak),i:0,right:0,marks:[],exam:false,wrong:[],t0:now()};question();};
  $("#wp").onclick=()=>{if(confirm("למחוק את כל ההתקדמות?")){ST={items:{},hist:[],streak:{last:0,days:0}};save();go("progress");}};}

document.addEventListener("keydown",e=>{
  if(SC!=="practice"&&SC!=="exam")return;
  if($("#nx")&&(e.key==="Enter")){e.preventDefault();$("#nx").click();return;}
  if(/^[1-4]$/.test(e.key)){const b=$$(".opt")[+e.key-1];if(b&&!b.disabled){e.preventDefault();b.click();}}});

go("home");
</script>
